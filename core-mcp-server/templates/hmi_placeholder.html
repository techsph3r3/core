<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMI Dashboard - Not Connected</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3);
        }
        .icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .steps {
            text-align: left;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 30px;
        }
        .steps h3 {
            color: #10b981;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .steps ol {
            margin-left: 20px;
            color: #d1d5db;
        }
        .steps li {
            margin-bottom: 10px;
            padding-left: 10px;
        }
        .steps code {
            background: rgba(16, 185, 129, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #34d399;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
        <h1>HMI Dashboard</h1>
        <p>No HMI system is currently connected. Deploy an ICS topology to access the HMI dashboard.</p>

        <div class="steps">
            <h3>To Connect an HMI:</h3>
            <ol>
                <li>Go to <strong>Quick Start</strong> tab</li>
                <li>Select <code>ICS Sorting Facility</code> template</li>
                <li>Click <strong>Deploy</strong> to create the network</li>
                <li>Return here to access the Node-RED HMI dashboard</li>
            </ol>
        </div>

        <button class="btn" onclick="window.parent.postMessage({action: 'switchTab', tab: 'quickstart'}, '*')">
            Go to Quick Start
        </button>
    </div>

    <script>
        // Check for HMI availability periodically
        setInterval(async () => {
            try {
                const response = await fetch('/api/session/status');
                const data = await response.json();
                if (data.nodes) {
                    const hmiNode = data.nodes.find(n => n.name === 'hmi' || n.image?.includes('nodered'));
                    if (hmiNode && hmiNode.ip) {
                        window.location.href = `http://${hmiNode.ip}:1880/ui`;
                    }
                }
            } catch (e) {
                // Ignore errors
            }
        }, 5000);
    </script>
</body>
</html>
